[project]
name = "cadence"
version = "0.1.0"
description = "Natural-language playlist generation with grounded retrieval and learned sequencing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "rich>=13.7",
    "orjson>=3.9",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.9", "httpx>=0.27"]

[project.scripts]
cadence = "cadence.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadence"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# The stopword list is deliberately a wrapped block: the list-literal form ruff
# prefers is a single 90-word line that nobody can review.
"src/cadence/text.py" = ["SIM905"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite imports `from tests.conftest import ...`, which needs the project
# root importable. Without it collection fails with "No module named 'tests'"
# — three errors, and only when pytest is invoked from this directory rather
# than through the root Makefile, which is exactly how CI runs it.
pythonpath = ["."]
addopts = "-q"
