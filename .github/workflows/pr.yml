# Validate: no green, no merge.
#
# Written for THIS repo, not copied. The flywheel template's pr.yml is Go —
# setup-go, go.mod, golangci-lint, go test -race — and this is a Python
# monorepo with no go.mod, so every job would have failed on every PR. A gate
# that can only fail is one everyone learns to ignore, which is the bypass the
# standing rule is about.
name: pr

on:
  pull_request:

jobs:
  # The repo's own gate, which passes today. check-claims verifies the root
  # README's hand-typed numbers against each app's artifacts — the closest
  # thing here to "the published pages are still true", and several open beads
  # are corrections to exactly those numbers.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Pinned, not read from a file: there is no .python-version here, and
          # python-version-file pointing at a missing file fails the job on its
          # first step. Every pyproject declares >=3.11; 3.12 is what the work
          # is actually done on.
          python-version: "3.12"
      - run: pip install uv
      # The Makefile calls ostinato/.venv/bin/python and .../ruff directly, so
      # the venvs must exist before it runs — on a fresh runner they do not and
      # check-claims dies with exit 127. It passed locally only because those
      # venvs were already built, which is the whole reason this failed in CI
      # and not on my machine.
      - run: |
          for a in cadence timbre segue gamut ostinato; do
            uv sync --extra dev --project "$a"
          done
      - run: make lint-all

  # The shared tooling in scripts/ belongs to no app, so the matrix below never
  # collects its tests. reconcile_board.py decides whether a bead is closed,
  # and an untested decision there is how spot-2ig came to be marked shipped
  # while its work sat off main for a day — it gets its own gate. Only ostinato
  # is synced: pytest is the whole dependency, and it is the venv the Makefile
  # already reaches for.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --extra dev --project ostinato
      - run: make test-scripts

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [cadence, timbre, segue, gamut, ostinato]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Pinned, not read from a file: there is no .python-version here, and
          # python-version-file pointing at a missing file fails the job on its
          # first step. Every pyproject declares >=3.11; 3.12 is what the work
          # is actually done on.
          python-version: "3.12"
      - run: pip install uv
      # Run INSIDE the app, not from the root with --project. From the root
      # pytest collects every app's tests against one app's dependencies: 28
      # collection errors, none of them real. Verified by running it both ways.
      #
      # fail-fast is off on purpose: five apps, and knowing which three broke
      # is worth more than stopping at the first.
      # --extra dev: pytest is declared under [project.optional-dependencies]
      # dev, and uv run does not install extras by default, so a fresh runner
      # fails with "Failed to spawn: pytest". Locally the venv already had it.
      - run: uv run --extra dev pytest -q
        working-directory: ${{ matrix.app }}
